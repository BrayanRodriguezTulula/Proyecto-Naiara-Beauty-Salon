<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floreria La Orquidea</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
    <h1>Floreria La Orquidea</h1>
    <nav>
      <a href="#inicio">Inicio</a>
      <a href="#arreglos">Nuestros arreglos</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>
  <main>
    <section id="arreglos" class="tarjeta">
      <h2>Nuestros arreglos</h2>
      <p>Somos una floreria de barrio dedicada a llenar de vida tus momentos especiales con flores frescas todos los dias.</p>
      <ul>
        <li>Ramo de rosas - 60 bs.</li>
        <li>Ramo de girasoles - 35bs.</li>
        <li>Planta en maceta - 20bs.</li>
      </ul>
    </section>
    <section id="contacto" class="tarjeta">
      <h2>Encarga tus flores</h2>
      <form>
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre y apellido" required>

        <label for="correo">Correo electronico</label>
        <input type="email" id="correo" name="correo" placeholder="tunombre@correo.com" required>

        <label for="detalle">Detalle del pedido</label>
        <textarea id="detalle" name="detalle" rows="4" placeholder="Cuentanos que arreglo necesitas"></textarea>
      </form>
      <button type="button" id="btn-confirmar">Hacer mi pedido</button>
      <p id="mensaje" class="oculto"></p>
    </section>
  </main>
</body>
</html>
