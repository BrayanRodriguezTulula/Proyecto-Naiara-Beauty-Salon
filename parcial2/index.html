<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria Patitas</title>
</head>
<body>
    <header>
    <h1>Veterinaria Patitas</h1>
    <p>La salud de tu mascota en las mejores manos.</p>
  </header>

  <main>
    <form id="form-turno" novalidate method="POST" action="procesar.php">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" placeholder="Tu nombre y apellido" required>

      <label for="correo">Correo electronico</label>
      <input type="email" id="correo" name="correo" placeholder="tunombre@correo.com" required>

      <label for="mascota">Cuentanos de tu mascota</label>
      <textarea id="mascota" name="mascota" rows="4" placeholder="Cuentanos que atencion necesita tu mascota"></textarea>

      <button type="submit">Reservar mi turno</button>

      <p id="aviso-turno" class="aviso"></p>
    </form>
  </main>
  
</body>
</html>
